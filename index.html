<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Prueba Diagnóstico</title>
</head>
<body style="font-family: Arial; padding: 20px;">
  <h2>Prueba de Envío - Diagnóstico</h2>
  
  <p><strong>4. Acuerdos:</strong></p>
  <textarea id="acuerdos" style="width:100%; height:60px;">Prueba de acuerdos</textarea>
  
  <p><strong>5. Estado Obra:</strong></p>
  <textarea id="estadoObra" style="width:100%; height:60px;">Prueba de estado</textarea>
  
  <p><strong>6. Acceso:</strong></p>
  <textarea id="acceso" style="width:100%; height:60px;">Prueba de acceso</textarea>
  
  <p><strong>7. Previsión:</strong></p>
  <textarea id="prevision" style="width:100%; height:60px;">Prueba prevision</textarea>
  
  <p><strong>11. Fecha:</strong></p>
  <textarea id="fechaReunion" style="width:100%; height:60px;">Prueba fecha</textarea>
  
  <br><br>
  <button onclick="enviarActa()" style="padding: 20px 40px; font-size: 18px; background: #2980b9; color: white; border: none; cursor: pointer;">
    GENERAR Y ENVIAR ACTA (PRUEBA)
  </button>
  
  <p id="status" style="font-size: 18px; font-weight: bold;"></p>

  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

  <script>
    const URL_API = "https://script.google.com/macros/s/AKfycbzhwEDwCVmoiW8K5iDGIBVz_E014HNGVMi-lsLJePH69IO-3obYzM7Vv1gA43825y4/exec"; 

    function enviarActa() {
      alert("PASO 1: Botón pulsado. La función JavaScript SÍ se está ejecutando.");
      
      var datos = {
        acuerdos: document.getElementById('acuerdos').value,
        estadoObra: document.getElementById('estadoObra').value,
        acceso: document.getElementById('acceso').value,
        prevision: document.getElementById('prevision').value,
        fechaReunion: document.getElementById('fechaReunion').value,
        municipio: "Écija"
      };
      
      alert("PASO 2: Datos recogidos correctamente. Preparando envío...");
      
      try {
        // Crear formulario oculto
        var form = document.createElement('form');
        form.method = 'POST';
        form.action = URL_API;
        form.target = 'hidden_iframe';
        
        var input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'datos';
        input.value = JSON.stringify(datos);
        
        form.appendChild(input);
        document.body.appendChild(form);
        
        alert("PASO 3: Formulario creado. A punto de enviar a Google...");
        
        form.submit();
        
        alert("PASO 4: ¡Envío realizado! Esperando respuesta de Google...");
        
        document.getElementById('status').style.color = "green";
        document.getElementById('status').textContent = "✅ Petición enviada. Revisa tu correo en 1 minuto.";
        
      } catch (error) {
        alert("ERROR CRÍTICO: " + error.message);
        document.getElementById('status').style.color = "red";
        document.getElementById('status').textContent = "Error: " + error.message;
      }
    }
  </script>
</body>
</html>
